[project]
name = "service-b"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikita Selivanov", email = "flgjkdoged228@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[all]>=0.165.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
service-b = "service_b:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
